        #if ($server_port !~ 9090){
            #rewrite ^(/.*)$ https://$host$1 permanent;
       # }

        location / {
            root   html;
            index  index.html;
        }
        location /showVideo {
            proxy_pass   http://10.60.93.55:5550;
        }
        location /connect {
            rewrite ^/connect/(.*)$ /$1 break; #拦截标识去除
            proxy_pass http://10.60.93.55:5500; #这里是http不是ws，不用怀疑，代理的ip和port写ws访问的实际地址
            proxy_http_version 1.1; #这里必须使用http 1.1
            #下面两个必须设置，请求头设置为ws请求方式
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location ~ ^/port99([5-9][0-9]) {
            set $target_port 99$1;  # 将匹配的端口号设置为目标端口
            rewrite ^/port99([5-9][0-9])/(.*)$ /$2 break;  # 拦截标识去除
            proxy_pass http://10.60.93.55:$target_port;  # 使用动态目标端口
            proxy_http_version 1.1;  # 使用 HTTP 1.1
            # 设置请求头为 WS 请求方式
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }


        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

